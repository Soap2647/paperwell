# Masaüstü kurulum paketleri (Windows NSIS + MSI). Elle (Actions → Desktop → Run workflow) ya da v* etiketiyle çalışır.
# Paketler iş akışının "Artifacts" bölümüne yüklenir.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint ve testler
        run: |
          npx eslint src
          npm test

      - name: Tauri paketi
        run: npx tauri build

      - name: Paketleri yükle
        uses: actions/upload-artifact@v4
        with:
          name: paperwell-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # v* etiketiyle çalışınca kurulum dosyaları GitHub Releases'e de eklenir (README'deki kurulum adımları buradan indirir)
      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
