<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paperwell: tarayıcıda çalışan, açık kaynak PDF ve görsel editörü. Metni orijinal fontla düzenleyin, akıllı silgi, gerçek karartma, imza." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Paperwell</title>
    <script>
      try { var t = localStorage.getItem('paperwell.theme') || 'system'; if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
